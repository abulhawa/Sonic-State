name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm test -- --runInBand --coverage
      - name: Validate Expo package alignment
        run: npx expo install --check
      - name: Validate Expo SDK configuration
        run: npx --yes expo-doctor@latest
      - name: Bundle Android JavaScript with Expo CLI
        run: npx expo export --platform android --output-dir dist-ci
      - name: Security audit
        run: npm audit --audit-level=high
